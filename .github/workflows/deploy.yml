name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        run: |
          flutter build web --release \
            --dart-define=MAPS_EMBED_API_KEY="${{ secrets.MAPS_EMBED_API_KEY }}" \
            --dart-define=UMS_PROXY_URL="${{ secrets.UMS_PROXY_URL }}" \
            --dart-define=CLASSROOM_CLIENT_ID="${{ secrets.CLASSROOM_CLIENT_ID }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=my-seu
